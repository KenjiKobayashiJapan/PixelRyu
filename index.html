<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelRyu — Calm cosmic puzzle games</title>
<meta name="description" content="PixelRyu makes calm, beautiful puzzle games for mobile.">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: radial-gradient(ellipse at top, #172244 0%, #080d1f 50%, #02040c 100%);
    color: #e4ebf5;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    max-width: 720px;
    width: 100%;
    padding: 80px 32px;
    text-align: center;
  }
  .logo-wrap { margin-bottom: 24px; }
  h1 {
    font-size: 72px;
    margin: 0;
    background: linear-gradient(90deg, #5ea1ff 0%, #ff6bc4 60%, #ffd455 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    font-weight: 800;
    letter-spacing: -1px;
  }
  .tagline {
    font-size: 20px;
    color: #8b9bbd;
    margin-bottom: 64px;
  }
  h2 {
    font-size: 14px;
    color: #6c7d9d;
    margin: 64px 0 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
  }
  .game-list { list-style: none; padding: 0; margin: 0; }
  .game-card {
    background: rgba(122, 176, 255, 0.06);
    border: 1px solid rgba(122, 176, 255, 0.20);
    border-radius: 18px;
    padding: 28px 32px;
    margin-bottom: 16px;
    text-align: left;
    transition: all 0.25s ease;
  }
  .game-card:hover {
    background: rgba(122, 176, 255, 0.12);
    border-color: rgba(122, 176, 255, 0.50);
    transform: translateY(-2px);
  }
  .game-card a {
    color: #7ab0ff;
    text-decoration: none;
    font-size: 26px;
    font-weight: 700;
  }
  .game-card a:hover { color: #a0c8ff; }
  .game-card .desc { color: #a8b5d0; margin-top: 10px; font-size: 15px; line-height: 1.6; }
  .game-card .links {
    margin-top: 14px;
    font-size: 13px;
    color: #6c7d9d;
  }
  .game-card .links a {
    font-size: 13px;
    color: #6c7d9d;
    text-decoration: underline;
    margin-right: 14px;
    font-weight: 400;
  }
  .game-card .links a:hover { color: #aac0e0; }
  .footer {
    color: #4a5878;
    font-size: 13px;
    margin-top: 96px;
  }
  @media (max-width: 600px) {
    h1 { font-size: 56px; }
    .container { padding: 60px 24px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <h1>PixelRyu</h1>
  </div>
  <div class="tagline">Calm cosmic puzzle games</div>

  <h2>Games</h2>
  <ul class="game-list">
    <li class="game-card">
      <a href="liquid-glow/">Liquid Glow</a>
      <div class="desc">A meditative sort puzzle. Pour glowing liquids between glass tubes and watch them flow through the cosmos.</div>
      <div class="links">
        <a href="liquid-glow/privacy_policy.html">Privacy</a>
        <a href="liquid-glow/terms_of_service.html">Terms</a>
      </div>
    </li>
  </ul>

  <div class="footer">© <span id="year"></span> PixelRyu</div>
</div>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
