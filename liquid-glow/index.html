<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">Liquid Glow — Legal</title>
<meta name="description" data-i18n-attr="content" data-i18n="meta_desc" content="Legal documents for Liquid Glow by PixelRyu.">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: radial-gradient(ellipse at top, #172244 0%, #080d1f 50%, #02040c 100%);
    color: #e4ebf5;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    max-width: 580px;
    width: 100%;
    padding: 80px 32px;
    text-align: center;
    position: relative;
  }
  .lang-switch {
    position: absolute;
    top: 24px;
    right: 24px;
  }
  .lang-switch select {
    background: rgba(122, 176, 255, 0.06);
    color: #e4ebf5;
    border: 1px solid rgba(122, 176, 255, 0.20);
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .lang-switch select:hover {
    background: rgba(122, 176, 255, 0.12);
    border-color: rgba(122, 176, 255, 0.50);
  }
  .lang-switch select option { background: #0d1428; color: #e4ebf5; }
  h1 {
    font-size: 56px;
    margin: 0 0 12px;
    color: #d8e3f5;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .tagline {
    font-size: 16px;
    color: #6c7d9d;
    margin-bottom: 56px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .links { list-style: none; padding: 0; margin: 0; }
  .links li {
    background: rgba(122, 176, 255, 0.06);
    border: 1px solid rgba(122, 176, 255, 0.20);
    border-radius: 14px;
    margin-bottom: 14px;
    transition: all 0.25s ease;
  }
  .links li:hover {
    background: rgba(122, 176, 255, 0.12);
    border-color: rgba(122, 176, 255, 0.50);
  }
  .links a {
    color: #7ab0ff;
    text-decoration: none;
    font-size: 18px;
    font-weight: 600;
    display: block;
    padding: 22px 24px;
  }
  .back {
    display: inline-block;
    margin-top: 48px;
    color: #6c7d9d;
    text-decoration: none;
    font-size: 14px;
  }
  .back:hover { color: #aac0e0; }
  @media (max-width: 600px) {
    .lang-switch { top: 16px; right: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="lang-switch">
    <select id="lang-select" aria-label="Language"></select>
  </div>
  <h1>Liquid Glow</h1>
  <div class="tagline" data-i18n="tagline">Legal Documents</div>
  <ul class="links">
    <li><a href="privacy_policy.html" data-i18n="link_privacy">Privacy Policy</a></li>
    <li><a href="terms_of_service.html" data-i18n="link_terms">Terms of Service</a></li>
  </ul>
  <a href="../" class="back" data-i18n="back">← PixelRyu</a>
</div>
<script>
  const LANGUAGES = [
    {code:'en', flag:'🇺🇸', name:'English'},
    {code:'ja', flag:'🇯🇵', name:'日本語'},
    {code:'zh', flag:'🇨🇳', name:'简体中文'},
    {code:'ko', flag:'🇰🇷', name:'한국어'},
    {code:'de', flag:'🇩🇪', name:'Deutsch'},
    {code:'fr', flag:'🇫🇷', name:'Français'},
    {code:'es', flag:'🇪🇸', name:'Español'},
    {code:'pt', flag:'🇧🇷', name:'Português'},
    {code:'ru', flag:'🇷🇺', name:'Русский'}
  ];

  const i18n = {
    en: {
      title: "Liquid Glow — Legal",
      meta_desc: "Legal documents for Liquid Glow by PixelRyu.",
      tagline: "Legal Documents",
      link_privacy: "Privacy Policy",
      link_terms: "Terms of Service",
      back: "← PixelRyu"
    },
    ja: {
      title: "Liquid Glow — 規約",
      meta_desc: "PixelRyu 提供「Liquid Glow」の規約類。",
      tagline: "規約類",
      link_privacy: "プライバシーポリシー",
      link_terms: "利用規約",
      back: "← PixelRyu へ戻る"
    },
    zh: {
      title: "Liquid Glow — 法律条款",
      meta_desc: "PixelRyu 出品《Liquid Glow》的法律文件。",
      tagline: "法律文件",
      link_privacy: "隐私政策",
      link_terms: "服务条款",
      back: "← 返回 PixelRyu"
    },
    ko: {
      title: "Liquid Glow — 법적 고지",
      meta_desc: "PixelRyu의 'Liquid Glow' 법적 고지.",
      tagline: "법적 고지",
      link_privacy: "개인정보 처리방침",
      link_terms: "서비스 이용약관",
      back: "← PixelRyu로 돌아가기"
    },
    de: {
      title: "Liquid Glow — Rechtliches",
      meta_desc: "Rechtsdokumente für Liquid Glow von PixelRyu.",
      tagline: "Rechtsdokumente",
      link_privacy: "Datenschutzerklärung",
      link_terms: "Nutzungsbedingungen",
      back: "← Zurück zu PixelRyu"
    },
    fr: {
      title: "Liquid Glow — Mentions légales",
      meta_desc: "Documents légaux pour Liquid Glow, par PixelRyu.",
      tagline: "Documents légaux",
      link_privacy: "Politique de confidentialité",
      link_terms: "Conditions d'utilisation",
      back: "← Retour à PixelRyu"
    },
    es: {
      title: "Liquid Glow — Legal",
      meta_desc: "Documentos legales para Liquid Glow, por PixelRyu.",
      tagline: "Documentos legales",
      link_privacy: "Política de privacidad",
      link_terms: "Términos del servicio",
      back: "← Volver a PixelRyu"
    },
    pt: {
      title: "Liquid Glow — Legal",
      meta_desc: "Documentos legais de Liquid Glow, da PixelRyu.",
      tagline: "Documentos legais",
      link_privacy: "Política de privacidade",
      link_terms: "Termos de serviço",
      back: "← Voltar para PixelRyu"
    },
    ru: {
      title: "Liquid Glow — Правовые документы",
      meta_desc: "Правовые документы для Liquid Glow от PixelRyu.",
      tagline: "Правовые документы",
      link_privacy: "Политика конфиденциальности",
      link_terms: "Условия использования",
      back: "← Назад к PixelRyu"
    }
  };

  function detectLang() {
    const raw = (navigator.language || 'en').toLowerCase();
    for (const l of LANGUAGES) if (raw === l.code) return l.code;
    const head = raw.split(/[-_]/)[0];
    for (const l of LANGUAGES) if (head === l.code) return l.code;
    return 'en';
  }

  function setLang(lang) {
    const dict = i18n[lang];
    if (!dict) return;
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (!(key in dict)) return;
      const attr = el.getAttribute('data-i18n-attr');
      if (attr) el.setAttribute(attr, dict[key]);
      else el.textContent = dict[key];
    });
    const sel = document.getElementById('lang-select');
    if (sel) sel.value = lang;
  }

  (function init() {
    const sel = document.getElementById('lang-select');
    for (const l of LANGUAGES) {
      const opt = document.createElement('option');
      opt.value = l.code;
      opt.textContent = l.flag + ' ' + l.name;
      sel.appendChild(opt);
    }
    setLang(detectLang());
    sel.addEventListener('change', e => setLang(e.target.value));
  })();
</script>
</body>
</html>
